<rect x="50" y="84" width="720" height="72" rx="10" fill="#0B1020" stroke="#FFFFFF" stroke-opacity=".1"/><rect x="50" y="84" width="4" height="72" rx="2" fill="#7C6CF6"/><text x="72" y="126" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" fill="#C7D2FE">generator/</text><text x="196" y="115" font-size="14" fill="#E2E8F0">скрытая история → проводки → самопроверка → снимок чистых книг</text><text x="196" y="137" font-size="14" fill="#94A3B8">→ внесение ошибок → представление → публичный + закрытый эпизод</text>
