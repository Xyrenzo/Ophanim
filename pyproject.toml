[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophanim"
version = "0.1.0"
description = "OPHANIM - Financial Forensics Lab: a reproducible RL environment for AI accounts-payable auditing (Genesis Hackathon 2026, FinTech)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Runtime dependencies are pinned exactly; see requirements.lock for the full transitive set.
dependencies = [
    "pydantic==2.14.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
ophanim = "ophanim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
